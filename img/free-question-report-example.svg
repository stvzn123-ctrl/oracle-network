<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940"><rect width="720" height="940" fill="#f5f1e9"/><rect x="30" y="28" width="660" height="884" rx="12" fill="#fffdfa" stroke="#e5dccb"/><g font-family="Malgun Gothic, sans-serif" fill="#383630"><text x="76" y="91" font-size="15" fill="#89764e" letter-spacing="3">운명탐정 / 자유질문 리포트</text><text x="76" y="150" font-size="32" font-weight="700">나에게 맞는 다음 걸음</text><text x="76" y="187" font-size="15" fill="#827d72">가상의 질문을 사용한 답변 구성 예시입니다.</text><path d="M76 218H644" stroke="#d8cfbc"/><text x="76" y="258" font-size="14" fill="#89764e">질문</text><text x="76" y="292" font-size="21">새로운 일을 시작하고 싶은데, 어떻게 준비할까요?</text><rect x="70" y="325" width="580" height="122" rx="12" fill="#f5f1e7"/><text x="94" y="360" font-size="16" fill="#89764e">01 / 핵심 답변</text><text x="94" y="396" font-size="20" font-weight="700">작게 경험하며 나에게 맞는 방향을 확인해 보세요.</text><text x="94" y="427" font-size="16">지금의 생활을 지키면서 새로운 가능성을 살펴볼 수 있어요.</text><text x="76" y="499" font-size="16" fill="#89764e">02 / 나에게 맞는 해설</text><text x="76" y="537" font-size="18">새로운 일에서 무엇을 얻고 싶은지 먼저 적어 보세요.</text><text x="76" y="572" font-size="18">관심만으로 결론 내리기보다 실제 업무를 경험해 보면</text><text x="76" y="607" font-size="18">기대와 현실의 차이를 알아가는 데 도움이 돼요.</text><text x="76" y="664" font-size="16" fill="#89764e">03 / 지금 할 수 있는 실천</text><text x="76" y="705" font-size="18">1. 관심 분야의 실제 업무 세 가지 알아보기</text><text x="76" y="743" font-size="18">2. 일주일 동안 작은 프로젝트 하나 해 보기</text><text x="76" y="781" font-size="18">3. 비용과 시간을 확인한 뒤 다음 단계 정하기</text><path d="M76 817H644" stroke="#d8cfbc"/><text x="76" y="849" font-size="13" fill="#827d72">구성 참고용 예시이며 개인의 운세를 해석한 결과가 아닙니다.</text><text x="76" y="875" font-size="13" fill="#827d72">실제 답변은 질문과 확인 가능한 개인 정보에 맞춰 작성합니다.</text></g></svg>
