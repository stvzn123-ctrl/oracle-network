<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리자 | 운명 네트워크</title>
<style>
:root{color-scheme:dark;--bg:#081723;--panel:#102330;--field:#0b1d29;--fg:#edf2f5;--muted:#9aafbd;--line:#29404e;--accent:#f2c45a;--ok:#8cdbb6;--bad:#edaaa7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Malgun Gothic",sans-serif}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:10px;min-width:0;max-width:100%}
button{cursor:pointer;min-height:44px;padding:8px 14px}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{padding:10px 12px;width:100%}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(8,23,35,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.bar h1{font-size:17px;flex:1;letter-spacing:-.02em}
.bar .me{font-size:12px;color:var(--muted)}
.bar button{min-height:36px;padding:4px 12px;font-size:13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;max-width:calc(100% - 32px);padding:12px 18px;border-radius:12px;background:#16384a;border:1px solid var(--accent);color:var(--fg);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.err{border-color:var(--bad);color:var(--bad)}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.list{position:sticky;top:64px;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.count{font-size:12px;color:var(--muted);margin:8px 2px}
#users{overflow:auto;display:grid;gap:6px;align-content:start;flex:1;min-height:0;overscroll-behavior:contain}
.u{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;min-height:56px;border-radius:10px}
.u .n{flex:1;min-width:0}
.u b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u small{color:var(--muted);font:11px ui-monospace,Consolas,monospace}
.u.on{border-color:var(--accent);background:#14303f}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--field);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#2f5d4b}
.empty{padding:70px 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:8px;font-size:19px}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.head h2{font-size:23px;overflow-wrap:anywhere}
.idrow{display:flex;gap:8px;align-items:center;margin-top:6px;font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.idrow button{min-height:30px;padding:2px 10px;font-size:12px}
.back{display:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:16px 0}
.facts div{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.facts dt{font-size:11px;color:var(--muted)}
.facts dd{margin:2px 0 0;overflow-wrap:anywhere;font-size:14px}
.facts{margin:12px 0 0}.sec.first{margin-top:14px;padding-top:0;border-top:0}.box{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}.k.on .box{background:var(--ok);border-color:var(--ok);color:#081723}.k .t{flex:1;text-align:left}
.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.sec h3{font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.help{font-size:12.5px;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:12px}
.k{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:48px;padding:8px 12px;text-align:left}
.k i{font-style:normal;font-size:11px;color:var(--muted)}
.k.on{background:#123226;border-color:#2f7a58;color:var(--ok)}
.k.on i{color:var(--ok)}
.k.all{grid-column:1/-1;font-weight:700}
.k.busy{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row select{flex:1;min-width:150px}
.primary{background:var(--accent);border-color:var(--accent);color:#081723;font-weight:700}
#report{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;margin-top:16px;max-height:60vh;overflow:auto}
#report:empty{display:none}
.skel{height:56px;border-radius:10px;background:linear-gradient(90deg,var(--field),#14303f,var(--field));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
[hidden]{display:none!important}
@media(max-width:820px){
.wrap{grid-template-columns:minmax(0,1fr);padding:12px}
.list{position:static;max-height:none}
#users{max-height:none}
body.picked .list{display:none}
body:not(.picked) #detailCard{display:none}
.back{display:inline-flex;align-items:center}
.k{min-height:52px}
}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div class="bar"><h1>운명 네트워크 · 관리자</h1><span class="me" id="me"></span><button id="refresh" title="목록 새로고침">새로고침</button><a href="index.html">사이트 →</a></div>
<div class="wrap" id="app" hidden>
 <aside class="card list" id="listCard">
  <input id="q" type="search" placeholder="이름 또는 계정 ID 검색" autocomplete="off" aria-label="회원 검색">
  <p class="count" id="count" aria-live="polite"></p>
  <div id="users"></div>
 </aside>
 <section class="card" id="detailCard">
  <div class="empty" id="none"><h2>왼쪽에서 회원을 고르세요</h2><p>승인 상태와 리포트를 한 화면에서 관리해요.</p></div>
  <div id="detail" hidden>
   <div class="head">
    <div>
     <button class="back" id="back">← 목록</button>
     <h2 id="name"></h2>
     <div class="idrow"><span id="sid"></span><button id="copy">ID 복사</button></div>
    </div>
    <span class="tag" id="badge"></span>
   </div>
   <div class="sec first">
    <h3>리포트 승인 <span class="tag" id="grantCount"></span></h3>
    <p class="help">체크하면 바로 승인되고, 체크를 풀면 회수돼요. 결제는 연결돼 있지 않으니 입금 확인 후 승인하세요.</p>
    <div class="grid" id="grid"></div>
   </div>
   <div class="sec"><h3>출생 정보</h3><dl class="facts" id="facts"></dl></div>
   <div class="sec">
    <h3>리포트 미리보기</h3>
    <p class="help">저장된 출생 정보로 자동 생성한 내용이에요.</p>
    <div class="row"><select id="rk" aria-label="리포트 선택"></select><button class="primary" id="preview">미리보기</button></div>
    <div id="report" role="status"></div>
   </div>
  </div>
 </section>
</div>
<div class="empty" id="gate"><p id="gateMsg">권한 확인 중…</p></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<script>
const API='https://oracle-api.stvzn123.workers.dev';
const KEYS={comprehensive:'종합',money:'재물·돈',love:'연애·인연',marry:'결혼·배우자',reunion:'재회',match:'궁합',work:'직업',study:'학업·성취',employment:'취업',move:'이직',invest:'투자',property:'부동산',business:'사업',exam:'대입·수능',cert:'자격증'};
const $=id=>document.getElementById(id);
let token='';try{token=localStorage.getItem('oracle-session')||''}catch{}
const short=id=>id.slice(0,8)+'…'+id.slice(-6);
const fmt=t=>{if(!t)return'';const d=new Date(t);return isNaN(d)?'':(d.getMonth()+1)+'/'+d.getDate()};
let members=[],offset=0,more=true,selected=null,seq=0,toastT;
const cache=new Map();            // id -> {u, at}
const grantsOf=u=>new Set(u.grants.filter(g=>!g.revoked_at).map(g=>g.report_key));

function toast(t,err){const el=$('toast');el.textContent=t;el.hidden=false;el.classList.toggle('err',!!err);clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,err?5000:2200)}
async function api(path,body){
  const r=await fetch(API+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:AbortSignal.timeout(20000)});
  let d={};try{d=await r.json()}catch{if(r.ok)throw Error('서버 응답을 읽지 못했어요.')}
  if(!r.ok)throw Error(r.status===401?'사이트에서 먼저 카카오 로그인해 주세요.':r.status===403?'관리자 계정만 접근할 수 있어요.':d.error==='revoke_all_first'?'먼저 ‘전체’ 승인을 회수해 주세요.':d.error==='profile_required'?'저장된 출생 정보가 없어요.':'요청을 처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  return d;
}

/* ---------- 목록 ---------- */
function rowEl(u){
  const b=document.createElement('button');b.className='u';b.dataset.id=u.id;
  const n=document.createElement('span');n.className='n';
  const nm=document.createElement('b');nm.textContent=u.nickname||'회원';
  const sm=document.createElement('small');sm.textContent=short(u.id)+(fmt(u.created)?' · '+fmt(u.created):'');
  n.append(nm,sm);b.append(n);
  if(u.profile_updated){const t=document.createElement('span');t.className='tag';t.textContent='정보';b.append(t)}
  const c=cache.get(u.id);if(c){const g=grantsOf(c.u).size;if(g){const t=document.createElement('span');t.className='tag ok';t.textContent='승인 '+g;b.append(t)}}
  if(u.id===selected)b.classList.add('on');
  return b;
}
function renderList(){
  const q=$('q').value.trim().toLowerCase(),box=$('users');
  const list=q?members.filter(u=>((u.nickname||'회원')+' '+u.id).toLowerCase().includes(q)):members;
  const frag=document.createDocumentFragment();
  for(const u of list.slice(0,300))frag.append(rowEl(u));
  box.replaceChildren(frag);
  $('count').textContent=(q?'검색 결과 '+list.length+'명 / ':'')+'전체 '+members.length+'명'+(more?' (불러오는 중…)':'')+(list.length>300?' · 검색으로 좁혀 보세요':'');
}
$('users').onclick=e=>{const b=e.target.closest('.u');if(b)open(b.dataset.id)};
$('q').oninput=renderList;

async function loadAll(reset){
  if(reset){members=[];offset=0;more=true;cache.clear()}
  const first=members.length===0;
  while(more){
    const d=await api('/admin/users?offset='+offset);
    members.push(...d.users);offset=d.nextOffset;more=offset!==null;
    if(first||!more||members.length%100===0)renderList();
    if(members.length>=2000)break;
  }
  more=false;renderList();
  try{sessionStorage.setItem('admin-users',JSON.stringify(members.slice(0,300)))}catch{}
}

/* ---------- 상세 ---------- */
function facts(p){
  const f=$('facts');f.replaceChildren();
  const rows=p?[['이름',p.name],['성별',p.sex==='m'?'남성':'여성'],['생년월일',p.date+(p.cal==='l'?' (음력)':'')],['출생 시각',p.notime?'모름':p.time],['출생지',p.place?.none?'미선택':p.place?.name]]:[['출생 정보','저장 안 됨']];
  for(const [k,v]of rows){const d=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v||'-';d.append(dt,dd);f.append(d)}
}
function paintGrants(u){
  const on=grantsOf(u),grid=$('grid');grid.replaceChildren();
  const mk=(k,label,cls)=>{const b=document.createElement('button');b.className='k'+(cls?' '+cls:'')+(on.has(k)?' on':'');b.dataset.key=k;const bx=document.createElement('span');bx.className='box';bx.textContent='✓';const s=document.createElement('span');s.className='t';s.textContent=label;b.setAttribute('role','checkbox');b.setAttribute('aria-checked',on.has(k));b.append(bx,s);return b};
  grid.append(mk('all','전체 리포트','all'));
  for(const [k,v]of Object.entries(KEYS))grid.append(mk(k,v));
  const n=on.size;$('grantCount').textContent=n?(on.has('all')?'전체 승인':n+'개 승인'):'승인 없음';
  $('grantCount').classList.toggle('ok',n>0);
  $('badge').textContent=n?'열람 승인 있음':'승인 없음';$('badge').classList.toggle('ok',n>0);
}
function paint(u,id){
  selected=id;$('none').hidden=true;$('detail').hidden=false;
  $('name').textContent=u.nickname||'회원';$('sid').textContent=short(id);
  facts(u.profile);paintGrants(u);$('report').textContent='';
  document.body.classList.add('picked');
  $('users').querySelectorAll('.u').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
}
async function open(id){
  const c=cache.get(id);
  if(c){paint(c.u,id)}                           // 캐시가 있으면 즉시 표시
  else{const m=members.find(x=>x.id===id);paint({nickname:m?.nickname,profile:null,grants:[]},id);$('facts').innerHTML='<div class="skel" style="grid-column:1/-1"></div>';$('grid').style.opacity=.4}
  const my=++seq;
  try{
    const u=await api('/admin/user?id='+encodeURIComponent(id));
    if(my!==seq)return;
    cache.set(id,{u});$('grid').style.opacity='';paint(u,id);
    const row=$('users').querySelector('.u[data-id="'+id+'"]');if(row){const m=members.find(x=>x.id===id);if(m)row.replaceWith(rowEl(m))}
  }catch(e){if(my===seq){$('grid').style.opacity='';toast(e.message,true)}}
}
$('back').onclick=()=>{document.body.classList.remove('picked');window.scrollTo(0,0)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(selected);toast('계정 ID를 복사했어요.')}catch{prompt('계정 ID',selected)}};

/* ---------- 권한 토글 ---------- */
$('grid').onclick=async e=>{
  const b=e.target.closest('.k');if(!b||!selected)return;
  const id=selected,key=b.dataset.key,c=cache.get(id);if(!c)return;
  const has=grantsOf(c.u).has(key),action=has?'revoke':'grant',name=key==='all'?'전체 리포트':KEYS[key];
  if(has&&!confirm(c.u.nickname+'님의 ['+name+'] 승인을 회수할까요?'))return;
  b.classList.add('busy');
  try{
    await api('/admin/permission',{userId:id,key,action});
    // 서버 재조회 없이 화면 상태를 먼저 반영하고, 뒤에서 조용히 동기화
    const now=Date.now();
    c.u.grants=c.u.grants.filter(g=>g.report_key!==key);
    c.u.grants.push({report_key:key,granted_at:now,revoked_at:has?now:null});
    if(selected===id)paintGrants(c.u);
    toast(name+(has?' 승인을 회수했어요.':' 승인했어요.'));
    const m=members.find(x=>x.id===id),row=$('users').querySelector('.u[data-id="'+id+'"]');if(m&&row)row.replaceWith(rowEl(m));
    api('/admin/user?id='+encodeURIComponent(id)).then(u=>{cache.set(id,{u});if(selected===id)paintGrants(u)}).catch(()=>{});
  }catch(err){b.classList.remove('busy');toast(err.message,true)}
};

/* ---------- 리포트 미리보기 ---------- */
for(const [k,v]of Object.entries(KEYS))$('rk').add(new Option(v,k));
$('preview').onclick=async()=>{
  const id=selected,btn=$('preview');if(!id)return;btn.disabled=true;$('report').textContent='리포트를 만드는 중…';
  try{const r=await api('/admin/preview?userId='+encodeURIComponent(id)+'&key='+encodeURIComponent($('rk').value));if(selected===id)$('report').textContent=r.title+'\n\n'+r.body}
  catch(e){$('report').textContent='';toast(e.message,true)}finally{btn.disabled=false}
};
$('refresh').onclick=async()=>{const b=$('refresh');b.disabled=true;try{await loadAll(true);toast('목록을 새로 불러왔어요.')}catch(e){toast(e.message,true)}finally{b.disabled=false}};

/* ---------- 시작: 권한 확인과 목록을 동시에 ---------- */
(async()=>{
  try{
    if(!token)throw Error('사이트에서 먼저 카카오 로그인해 주세요.');
    try{const c=JSON.parse(sessionStorage.getItem('admin-users')||'null');if(c?.length){members=c;more=false;$('gate').hidden=true;$('app').hidden=false;renderList()}}catch{}
    const [acc]=await Promise.all([api('/access'),loadAll(true)]);
    $('me').textContent=short(acc.id);
    if(!acc.isAdmin)throw Error('관리자 계정이 아니에요.');
    $('gate').hidden=true;$('app').hidden=false;
    if(!selected&&members[0]&&matchMedia('(min-width:821px)').matches)open(members[0].id);
  }catch(e){$('app').hidden=true;$('gate').hidden=false;$('gateMsg').textContent=e.message}
})();
</script>
</body>
</html>
