<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운명 네트워크 관리자</title><style>:root{color-scheme:dark;--bg:#071827;--fg:#f4f0e6;--line:#375568;--accent:#f2c45a}*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font:16px/1.7 system-ui;margin:0}main{max-width:960px;margin:auto;padding:24px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);max-width:100%}button{cursor:pointer;min-height:44px}button:disabled{opacity:.5}a{color:var(--accent)}section{padding:20px 0;border-top:1px solid var(--line)}label{display:block;margin:12px 0}textarea{display:block;width:100%;min-height:280px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#users{display:grid;gap:10px}#notice{white-space:pre-wrap}#message{color:var(--accent)}[hidden]{display:none!important}</style><main><a href="index.html">← 사이트로</a><h1>관리자 페이지</h1><p>저장에 동의한 회원의 정보와 리포트 열람 권한을 관리합니다.</p><p id="notice">로그인 권한 확인 중…</p><p id="message" role="status"></p><div id="admin" hidden><section><h2>회원 목록</h2><button id="refresh">목록 새로고침</button><div id="users"></div><button id="more" hidden>다음 25명</button></section><section id="detail" hidden><h2 id="memberName"></h2><details><summary>동의 후 저장한 출생 정보 확인</summary><pre id="profile"></pre></details><h3>리포트 열람 권한</h3><p>리포트 등록과 권한 승인은 별개입니다. 실제 결제는 아직 연결되지 않았습니다.</p><pre id="grants"></pre><label>대상 리포트 <select id="key"></select></label><button id="grant">열람 승인</button> <button id="revoke">승인 회수</button><h3>회원 전용 리포트 등록</h3><p>현재 선택한 회원에게 제공할 최종 리포트를 입력합니다. 개인정보와 내용을 확인한 뒤 등록하세요. HTML은 실행하지 않고 일반 텍스트로 표시합니다.</p><label>제목 <input id="title" maxlength="150"></label><label>본문 <textarea id="body" maxlength="100000"></textarea></label><button id="publish">리포트 등록</button></section></div></main><script>
const API='https://oracle-api.stvzn123.workers.dev',keys={all:'전체',comprehensive:'종합',love:'연애·인연',marry:'결혼·배우자',reunion:'재회',match:'궁합',employment:'취업',move:'이직',invest:'투자',property:'부동산',business:'사업',exam:'대입·수능',cert:'자격증'},$=id=>document.getElementById(id);let token='',selected=null,offset=0;try{token=localStorage.getItem('oracle-session')||''}catch{}const msg=t=>$('message').textContent=t;
async function api(path,body){const r=await fetch(API+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw Error(r.status===401?'사이트에서 먼저 카카오 로그인해주세요.':r.status===403?'관리자로 등록된 계정만 접근할 수 있습니다.':d.error==='revoke_all_first'?'먼저 전체 열람 승인을 회수해주세요.':'권한 서버 설정 또는 요청 내용을 확인해주세요.');return d}
for(const [k,v]of Object.entries(keys)){$('key').add(new Option(v,k))}
async function list(reset=true){if(reset){offset=0;$('users').replaceChildren()}const d=await api('/admin/users?offset='+offset);for(const u of d.users){const b=document.createElement('button');b.textContent=(u.nickname||'회원')+' · '+u.id;b.style.overflowWrap='anywhere';b.onclick=()=>detail(u.id).catch(e=>msg(e.message));$('users').append(b)}offset=d.nextOffset;$('more').hidden=offset===null}
async function detail(id){const u=await api('/admin/user?id='+encodeURIComponent(id));selected=id;$('detail').hidden=false;$('memberName').textContent=u.nickname+' · '+id;$('profile').textContent=u.profile?JSON.stringify(u.profile,null,2):'저장된 출생 정보 없음';$('grants').textContent=u.grants.map(g=>(keys[g.report_key]||g.report_key)+' · '+(g.revoked_at?'회수됨':'승인됨')).join('\n')||'열람 승인 없음';$('title').value='';$('body').value='';msg('회원 정보를 불러왔습니다.')}
async function permission(action){if(!selected)return;const key=$('key').value;if(!confirm((action==='grant'?'승인':'회수')+' 대상: '+$('memberName').textContent+' / '+keys[key]))return;await api('/admin/permission',{userId:selected,key,action});await detail(selected);msg(action==='grant'?'열람을 승인했습니다.':'열람 승인을 회수했습니다.')}
async function publish(){if(!selected)return;const key=$('key').value;if(key==='all')throw Error('리포트를 하나 선택해주세요.');if($('body').value.trim().length<20||!$('title').value.trim())throw Error('제목과 20자 이상의 본문을 입력해주세요.');if(!confirm('이 회원의 '+keys[key]+' 리포트를 등록할까요? 기존 내용이 있으면 교체됩니다.'))return;await api('/admin/report',{userId:selected,key,title:$('title').value,body:$('body').value});msg('리포트를 등록했습니다. 열람 승인 여부도 확인해주세요.')}
for(const [id,fn]of [['refresh',()=>list()],['more',()=>list(false)],['grant',()=>permission('grant')],['revoke',()=>permission('revoke')],['publish',publish]])$(id).onclick=async()=>{const b=$(id);b.disabled=true;try{await fn()}catch(e){msg(e.message)}finally{b.disabled=false}};
(async()=>{try{if(!token)throw Error('사이트에서 먼저 카카오 로그인해주세요.');const u=await api('/access');$('notice').textContent='내 계정 ID: '+u.id;if(!u.isAdmin)throw Error('아직 관리자 계정이 아닙니다. 위 계정 ID를 서버 관리자 목록에 등록해야 합니다.');$('admin').hidden=false;await list()}catch(e){msg(e.message)}})();
</script></html>
